<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Brasa — Painel de Gestão</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <button
        class="brand admin-brand"
        data-page="overview"
        aria-label="Visão geral"
      >
        <span class="brand-mark">✦</span
        ><span>BRASA<small>PAINEL DE GESTÃO</small></span>
      </button>
      <nav id="nav"></nav>
      <div class="store-status">
        <span class="dot green"></span>
        <div>
          <b id="storeStatus">Loja aberta</b><small>Recebendo pedidos</small>
        </div>
      </div>
      <button
        class="view-store"
        onclick="toast('Abrindo a loja pública', 'ok')"
      >
        ← Ver loja
      </button>
    </aside>
    <div class="mobile-shade" onclick="toggleSidebar()"></div>
    <main>
      <header class="header">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div>
          <p id="pageDate">SEXTA-FEIRA, 18 DE JULHO</p>
          <h1 id="pageTitle">Visão geral</h1>
        </div>
        <div class="header-tools">
          <label class="search"
            ><span>⌕</span
            ><input
              id="globalSearch"
              placeholder="Buscar pedido, cliente…"
              oninput="globalSearch(this.value)" /></label
          ><button
            class="icon-button"
            id="sound"
            onclick="
              this.classList.toggle('muted');
              toast(
                this.classList.contains('muted')
                  ? 'Som desativado'
                  : 'Som de novos pedidos ativado',
                'ok',
              );
            "
          >
            ♬</button
          ><button
            class="icon-button"
            onclick="toast('3 notificações não lidas', 'info')"
          >
            ♧<b>3</b></button
          ><button
            class="profile"
            onclick="toast('Perfil de Marina Silva', 'info')"
          >
            <span>MS</span><i><b>Marina Silva</b><small>Administrador</small></i
            >⌄
          </button>
        </div>
      </header>
      <section id="app" class="app" tabindex="-1"></section>
    </main>
    <div id="backdrop" class="backdrop" onclick="closeOverlays()"></div>
    <aside id="drawer" class="drawer"></aside>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root"></div>
    <script src="admin.js"></script>
  </body>
</html>
